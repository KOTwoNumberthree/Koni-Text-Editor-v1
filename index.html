<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コードエディタ</title>
<!--
 【言語の追加】defLang('id',{name,ext:[拡張子],comment:'//'|['開始','終了'],indent:/字下げする行末/,
   rules:[{t:種別,re:'正規表現(キャプチャ括弧なし)'}|{t:種別,w:'単語 単語'}|{t:種別,re:'開始',ml:'終了'}(複数行)]}) を1つ書く。
   種別: k=キーワード s=文字列 n=数値 c=コメント f=関数 y=型 v=変数 p=組込 t=タグ a=属性 h=見出し。先に書いたルールが優先。
 【コマンドの追加】C('id','表示名(日本語)','英語の別名','Mod+Alt+Shift+キー'|'',関数,{ed:1(編集中のみ)|g:1(常に)}) を1行足すと
   パレットとショートカットに登録される。ツールバーは TB 配列に [id,アイコン] を足す。
 【テーマの追加】THEMES に {name,v:{bg,fg,...}} を足す（キーは --変数名）。パレットの「テーマ:」に自動で並ぶ。
 前提: 外部依存なし・状態はメモリのみ。内部は 行配列 + 選択配列、描画は表示行のみの仮想化。
-->
<style>
:root{--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK JP","BIZ UDGothic","MS Gothic",monospace;--fs:15px;--lh:23px;--tab:4;--gw:60px;--iw:4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%;font:13px/1.4 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif}
body{height:var(--vh,100dvh);display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc,#007fd4);outline-offset:-2px}
#tb{display:flex;gap:2px;padding:2px 4px;background:var(--tb);overflow-x:auto;flex:none;color:#ccc}
#tb button{flex:none;min-width:44px;min-height:44px;padding:0 6px;border:0;border-radius:6px;background:none;font-size:17px;cursor:pointer}
#tb button:hover,#tb button[aria-pressed=true]{background:#ffffff26}
#tb i{flex:none;width:1px;background:#ffffff33;margin:8px 3px}
#tabs{display:flex;overflow-x:auto;background:var(--tab);flex:none;scrollbar-width:thin}
.tw{display:flex;align-items:center;flex:none;background:var(--tabi);color:var(--tabfg);border-right:1px solid var(--bd)}
.tw.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 1px var(--acc,#007fd4)}
.tw button{background:none;border:0;min-height:44px;cursor:pointer;white-space:nowrap}
.tw .n1{padding:0 4px 0 12px}.tw .x1{min-width:36px;font-size:16px}
#fb{display:none;flex-wrap:wrap;gap:4px;padding:4px;background:var(--tab);border-bottom:1px solid var(--bd)}
#fb.on{display:flex}
#fb input[type=text]{flex:1 1 130px;min-width:0;min-height:44px;padding:0 8px;border:1px solid var(--bd);background:var(--bg)}
#fb label{display:flex;align-items:center;gap:4px;min-height:44px;white-space:nowrap}
#fb input[type=checkbox]{width:20px;height:20px}
#fb button{min-height:44px;min-width:44px;padding:0 10px;border:1px solid var(--bd);background:var(--tabi);cursor:pointer}
#fcnt{display:flex;align-items:center;min-width:4em;color:var(--gut)}
#ed{flex:1;position:relative;min-height:0;font-family:var(--mono);font-size:var(--fs)}
#view{position:absolute;inset:0;overflow:auto;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:text}
#lines{position:relative}
#bg,#rows,#cu{position:absolute;left:0;top:0;width:100%}
#bg div{position:absolute;height:var(--lh)}
.clb{background:var(--cl)}.sl{background:var(--sel)}.fm{background:var(--fm)}.fmc{background:var(--fmc)}.bm{background:var(--bm);outline:1px solid var(--gut)}
#rows{z-index:1}#cu{z-index:3;pointer-events:none}
.r{position:absolute;left:0;right:0;height:var(--lh);line-height:var(--lh);display:flex;white-space:pre;tab-size:var(--tab);font-variant-ligatures:none}
.g{position:sticky;left:0;z-index:2;flex:none;width:var(--gw);display:flex;background:var(--bg);color:var(--gut)}
.fa{width:26px;text-align:center;cursor:pointer;font-style:normal;font-weight:400;font-size:12px}
.ln{flex:1;text-align:right;padding-right:14px;font-style:normal}
.cl .ln{color:var(--guta)}
.x{flex:1;position:relative;padding-left:4px}
.x::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:calc(var(--ig)*1ch);background:repeating-linear-gradient(90deg,var(--guide) 0 1px,transparent 1px calc(var(--iw)*1ch));pointer-events:none}
.noguide .x::before{display:none}
.fd{display:inline-block;margin-left:6px;padding:0 6px;line-height:calc(var(--lh) - 6px);background:var(--sel);border-radius:3px;text-decoration:none;cursor:pointer;vertical-align:middle}
.fd::after{content:"…"}
.cu{position:absolute;width:2px;height:var(--lh);background:var(--cur);animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cu{animation:none}}
.ws{color:var(--ws)}.wt{position:relative}.wt::before{content:"→";position:absolute;color:var(--ws)}
.k{color:var(--k)}.s{color:var(--s)}.n{color:var(--n)}.c{color:var(--c)}.f{color:var(--f)}.y{color:var(--y)}.v{color:var(--v)}.p{color:var(--p)}.t{color:var(--t)}.a{color:var(--a)}.h{color:var(--h);font-weight:700}
#ta{position:absolute;z-index:4;left:0;top:0;width:2px;height:var(--lh);padding:0;border:0;margin:0;opacity:0;pointer-events:none;resize:none;overflow:hidden;font:16px var(--mono);white-space:pre}
#sb{display:flex;flex-wrap:wrap;background:var(--sbbg);color:var(--sbfg);flex:none;font-size:12px}
#sb span,#sb button{padding:4px 10px;background:none;border:0;cursor:default}
#sb button{cursor:pointer}#sb button:hover{background:#ffffff26}
@media (hover:none){#sb button{min-height:44px}}
#pl{position:fixed;inset:0;z-index:20;background:#0004}
#pl[hidden]{display:none}
#pb{margin:calc(env(safe-area-inset-top) + 8px) auto 0;width:min(640px,calc(100% - 16px));background:var(--pbg);border:1px solid var(--bd);box-shadow:0 4px 18px #0006}
#pi{display:block;width:100%;min-height:44px;padding:0 12px;border:0;border-bottom:1px solid var(--bd);background:var(--bg);font-size:16px}
#pr{max-height:50vh;overflow:auto}
.pi{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:44px;padding:0 12px;cursor:pointer}
.pi.on{background:var(--pon)}.pi small{color:var(--gut);white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--pbg);color:var(--fg);border:1px solid var(--bd);padding:8px 14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:30}
#toast.on{opacity:1}

[hidden]{display:none!important}
#app{flex:1;min-height:0;display:flex}#main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
#ab{flex:none;width:48px;display:flex;flex-direction:column;background:var(--ab);border-right:1px solid var(--bd)}
#ab button{position:relative;width:48px;min-height:48px;border:0;background:none;color:var(--abfg);font-size:20px;cursor:pointer}
#ab button:hover,#ab button[aria-pressed=true]{color:var(--abon)}
#ab button[aria-pressed=true]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--abon)}
#ab .sp{flex:1}
#sd{display:none;flex:none;width:260px;flex-direction:column;min-height:0;background:var(--sd);border-right:1px solid var(--bd)}
#sd.sv{display:flex}
#sdh{display:flex;align-items:center;justify-content:space-between;padding-left:12px;min-height:35px;font-size:11px;text-transform:uppercase}
#sdx{display:none;min-width:44px;min-height:44px;border:0;background:none;cursor:pointer}
.sdb{flex:1;overflow:auto;min-height:0}
.sh{padding:6px 12px;font-size:11px;font-weight:700;text-transform:uppercase}
.em{margin:0;padding:8px 12px;color:var(--gut)}
.ti{display:flex;align-items:center;gap:4px;width:100%;min-height:44px;padding:0 8px;border:0;background:none;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden}
.ti:hover,.pr:hover{background:var(--hov)}.ti.on{background:var(--pon)}
.ti i{flex:none;width:14px;font-style:normal;font-size:11px;text-align:center}.ti small{color:var(--gut)}
.bt{display:block;width:calc(100% - 24px);min-height:44px;margin:6px 12px;border:0;background:var(--acc);color:#fff;cursor:pointer}
#sq{display:flex;gap:4px;padding:8px}#gq{flex:1;min-width:0;min-height:44px;padding:0 8px;border:1px solid var(--bd);background:var(--inp)}
#gb,#pnx{min-width:44px;min-height:44px;border:1px solid var(--bd);background:var(--tabi);cursor:pointer}
#bc{flex:none;display:flex;gap:6px;padding:2px 12px;min-height:22px;font-size:12px;color:var(--tabfg);overflow-x:auto;white-space:nowrap;background:var(--bg)}
#pn{flex:none;display:flex;flex-direction:column;height:30vh;min-height:110px;max-height:280px;background:var(--bg);border-top:1px solid var(--bd)}
#pnh{display:flex;align-items:center;gap:8px;padding-left:12px;font-size:11px;text-transform:uppercase}#pnx{margin-left:auto;border:0;background:none}
#pnl{flex:1;overflow:auto}
.pr{display:flex;gap:6px;align-items:center;width:100%;min-height:44px;padding:0 12px;border:0;background:none;text-align:left;cursor:pointer}.pr small{color:var(--gut)}
.er{color:var(--err)}.wr{color:var(--warn)}
#tb{background:var(--tab);color:var(--abfg);border-bottom:1px solid var(--bd)}#tb button:hover,#tb button[aria-pressed=true]{background:var(--hov)}#tb i{background:var(--bd)}
#tabs{background:var(--tab)}
#sb{border-top:1px solid var(--bd);align-items:stretch}#sb .sp{flex:1}#sb button{color:inherit}#sb button:hover{background:var(--hov)}#sb button:empty{display:none}
#scrim{position:fixed;inset:0;z-index:14;background:#0006}
@media (pointer:fine){#tb button{min-height:30px;min-width:30px}.tw button{min-height:35px}#sb button{min-height:22px}.ti,.pr{min-height:24px}}
@media (min-width:1024px) and (hover:hover){#tb{display:none}body.tbs #tb{display:flex}}
@media not all and (min-width:1024px) and (hover:hover){#sd{position:fixed;z-index:15;left:0;top:0;bottom:0;display:flex;width:min(320px,86vw);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);transform:translateX(-102%);visibility:hidden;transition:transform .2s,visibility .2s;box-shadow:0 0 18px #0008}#sd.sv{transform:none;visibility:visible}#sdx{display:block}}
@media (max-width:767px){#app{flex-direction:column-reverse}#ab{flex-direction:row;width:auto;border-right:0;border-top:1px solid var(--bd)}#ab button{flex:1;width:auto;min-height:44px}#ab button[aria-pressed=true]::before{left:12px;right:12px;top:0;bottom:auto;width:auto;height:2px}#ab .sp{display:none}.lo{display:none!important}}
@media (prefers-reduced-motion:reduce){#sd{transition:none}}
</style>
</head>
<body>
<div id="app">
<nav id="ab" role="toolbar" aria-orientation="vertical" aria-label="アクティビティバー"><button id="a1" data-v="x" aria-label="エクスプローラー" title="エクスプローラー（Ctrl/Cmd+Shift+E）" aria-pressed="false">📁</button><button id="a2" data-v="s" aria-label="検索" title="フォルダー内を検索（Ctrl/Cmd+Shift+F）" aria-pressed="false">🔍</button><button id="a3" data-c="problems" aria-label="問題パネル" title="問題（Ctrl/Cmd+Shift+M）" aria-pressed="false">⚠</button><i class="sp"></i><button id="a4" data-c="settings" aria-label="設定" title="設定（Ctrl/Cmd+,）">⚙</button></nav>
<aside id="sd" aria-label="サイドバー"><div id="sdh"><b id="sdt">エクスプローラー</b><button id="sdx" aria-label="サイドバーを閉じる">✕</button></div>
 <div id="vx" class="sdb"><div class="sh">開いているエディター</div><div id="oe" role="listbox" aria-label="開いているエディター"></div><div class="sh" id="wn">フォルダー</div><div id="tree" role="tree" aria-label="フォルダツリー"></div></div>
 <div id="vs" class="sdb" hidden><div id="sq" role="search"><input id="gq" type="text" aria-label="フォルダー内を検索" placeholder="検索（Enterで実行）" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="gb" aria-label="検索を実行">→</button></div><div id="gr" aria-live="polite"></div></div></aside>
<div id="main">
<div id="tb" role="toolbar" aria-label="ツールバー"></div>
<div id="tabs" role="tablist" aria-label="開いているファイル"></div>
<nav id="bc" aria-label="パンくずリスト"></nav>
<div id="fb" role="search">
 <input type="text" id="fq" aria-label="検索語" placeholder="検索" autocomplete="off" autocapitalize="off" spellcheck="false">
 <input type="text" id="fr" aria-label="置換後の文字列" placeholder="置換" autocomplete="off" autocapitalize="off" spellcheck="false">
 <label><input type="checkbox" id="fc">大小区別</label>
 <span id="fcnt" aria-live="polite"></span>
 <button id="fp" aria-label="前を検索">前へ</button><button id="fnx" aria-label="次を検索">次へ</button>
 <button id="fo" aria-label="置換">置換</button><button id="fa" aria-label="すべて置換">すべて置換</button><button id="fx" aria-label="検索を閉じる">閉じる</button>
</div>
<div id="ed"><div id="view" aria-label="エディタ表示"><div id="lines"><div id="bg"></div><div id="rows"></div><div id="cu"></div>
 <textarea id="ta" aria-label="コードエディタ（入力）" aria-multiline="true" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea></div></div></div>
<section id="pn" aria-label="問題パネル" hidden><div id="pnh"><b>問題</b><span id="pnc"></span><button id="pnx" aria-label="問題パネルを閉じる">✕</button></div><div id="pnl"></div></section>
</div></div>
<div id="scrim" hidden></div>
<div id="sb" role="group" aria-label="ステータスバー"><button id="s7" aria-label="問題パネルを切り替え"></button><i class="sp"></i><button id="s1" aria-label="行へ移動"></button><button id="s2" class="lo" aria-label="すべて選択"></button><button id="s6" aria-label="インデント設定を切り替え"></button><button id="s5" class="lo" aria-label="BOMの有無を切り替え">UTF-8</button><button id="s4" class="lo" aria-label="改行コードを切り替え"></button><button id="s3" aria-label="言語を変更"></button></div>
<div id="pl" hidden><div id="pb"><input id="pi" aria-label="コマンドパレット入力" autocomplete="off" autocapitalize="off" spellcheck="false"><div id="pr" role="listbox"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fi" multiple hidden><input type="file" id="fd" multiple hidden>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),root=document.documentElement,view=$('view'),lines=$('lines'),rows=$('rows'),bgL=$('bg'),cuL=$('cu'),ta=$('ta');

/* ===== 言語レジストリ ===== */
const LANGS={};
const defLang=(id,o)=>{LANGS[id]=Object.assign({id,name:id,ext:[],rules:[],comment:'',indent:/[{(\[]\s*$/},o)};
const X={dq:/"(?:\\.|[^"\\])*"?/.source,sq:/'(?:\\.|[^'\\])*'?/.source,num:/\b(?:0[xX][\da-fA-F_]+|\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?)\b/.source,
 fn:/\b[A-Za-z_$][\w$]*(?=\s*\()/.source,ty:/\b[A-Z][\w$]*\b/.source,id:/\b[A-Za-z_$][\w$]*\b/.source};
const ID=[{t:'f',re:X.fn},{t:'y',re:X.ty},{t:'v',re:X.id}];
defLang('plain',{name:'プレーンテキスト',ext:['txt','log','text'],indent:/(?!)/});
defLang('javascript',{name:'JavaScript / TypeScript',ext:['js','mjs','cjs','jsx','ts','tsx'],comment:'//',rules:[
 {t:'c',re:'//.*'},{t:'c',re:'/\\*',ml:'\\*/'},{t:'s',re:'`',ml:'`'},{t:'s',re:X.dq+'|'+X.sq},{t:'n',re:X.num},
 {t:'k',w:'async await break case catch class const continue debugger default delete do else export extends finally for from function if import in instanceof let new of return static switch throw try typeof var void while with yield get set interface type enum implements public private protected readonly as'},
 {t:'p',w:'true false null undefined NaN Infinity this super console window document'},...ID]});
defLang('python',{name:'Python',ext:['py','pyw'],comment:'#',indent:/:\s*$/,rules:[
 {t:'s',re:'"""',ml:'"""'},{t:'s',re:"'''",ml:"'''"},{t:'c',re:'#.*'},{t:'s',re:X.dq+'|'+X.sq},{t:'n',re:X.num},{t:'p',re:'@[\\w.]+'},
 {t:'k',w:'and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case'},
 {t:'p',w:'True False None self cls print len range int str float list dict set tuple open super isinstance'},...ID]});
defLang('html',{name:'HTML / XML',ext:['html','htm','xml','svg','vue'],comment:['<!--','-->'],indent:/<(?!\/|!|br|hr|img|input|meta|link)[a-zA-Z][^>]*[^\/>]>\s*$/,rules:[
 {t:'c',re:'<!--',ml:'-->'},{t:'p',re:'<![A-Za-z][^>]*>?'},{t:'s',re:'=\\s*(?:"[^"]*"|\'[^\']*\')'},{t:'t',re:'</?[A-Za-z][\\w:-]*|/?>'},{t:'a',re:'[\\w:@.-]+(?=\\s*=)'},{t:'v',re:'&#?\\w+;'}]});
defLang('css',{name:'CSS',ext:['css','scss','less'],comment:['/*','*/'],rules:[
 {t:'c',re:'/\\*',ml:'\\*/'},{t:'s',re:X.dq+'|'+X.sq},{t:'k',re:'@[\\w-]+'},{t:'n',re:'#[0-9a-fA-F]{3,8}\\b|\\b\\d*\\.?\\d+(?:px|r?em|vh|vw|ms|s|deg|fr|pt|ch|%)?'},
 {t:'y',re:'[.#][A-Za-z_-][\\w-]*'},{t:'a',re:'-?[a-zA-Z][\\w-]*(?=\\s*:\\s*[^\\s{])'}]});
defLang('json',{name:'JSON',ext:['json','jsonc','webmanifest'],rules:[
 {t:'a',re:'"(?:\\\\.|[^"\\\\])*"(?=\\s*:)'},{t:'s',re:X.dq},{t:'n',re:'-?\\b\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?\\b'},{t:'p',w:'true false null'}]});
defLang('markdown',{name:'Markdown',ext:['md','markdown'],comment:['<!--','-->'],indent:/(?!)/,rules:[
 {t:'s',re:'^(?:```|~~~).*',ml:'^(?:```|~~~)'},{t:'s',re:'`[^`]+`'},{t:'h',re:'^#{1,6}[ \\t].*'},{t:'c',re:'^>.*'},{t:'k',re:'^[ \\t]*(?:[-*+]|\\d+\\.)[ \\t]'},
 {t:'v',re:'\\*\\*[^*]+\\*\\*|__[^_]+__'},{t:'t',re:'!?\\[[^\\]]*\\]\\([^)]*\\)'}]});
const cl=(id,name,ext,kw,pp)=>defLang(id,{name,ext,comment:'//',rules:[{t:'c',re:'//.*'},{t:'c',re:'/\\*',ml:'\\*/'},...(pp?[{t:'p',re:'^[ \\t]*#[ \\t]*\\w+'}]:[]),
 {t:'s',re:X.dq+'|'+X.sq},{t:'n',re:X.num},{t:'k',w:kw},{t:'p',w:'true false null NULL nullptr this'},...ID]});
cl('c','C / C++',['c','h','cpp','cc','cxx','hpp'],'auto break case char const continue default do double else enum extern float for goto if inline int long register return short signed sizeof static struct switch typedef union unsigned void volatile while class namespace template typename public private protected virtual new delete using bool try catch throw',1);
cl('java','Java',['java'],'abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for if implements import instanceof int interface long native new package private protected public return short static super switch synchronized throw throws try void volatile while var record');
cl('csharp','C#',['cs'],'abstract as base bool break byte case catch char class const continue decimal default do double else enum event finally float for foreach if in int interface internal is lock long namespace new object out override private protected public readonly ref return sealed short static string struct switch throw try typeof using var virtual void while async await');
defLang('shell',{name:'Shell',ext:['sh','bash','zsh','bashrc','zshrc'],comment:'#',indent:/(?:\bthen|\bdo|\{)\s*$/,rules:[
 {t:'c',re:'(?:^|\\s)#.*'},{t:'s',re:X.dq+'|'+X.sq},{t:'v',re:'\\$(?:\\w+|\\{[^}]*\\}|[@#?$!*])'},{t:'n',re:X.num},
 {t:'k',w:'if then else elif fi for while until do done case esac in function select return exit break continue local export readonly declare unset source alias echo cd set shift trap eval exec test'}]});
const byExt={};
function compile(L){if(L._re!==undefined)return;const p=[];L._t=[];L._ml=[];
 for(const r of L.rules){p.push('('+(r.w?'\\b(?:'+r.w.split(' ').join('|')+')\\b':r.re)+')');L._t.push(r.t);L._ml.push(r.ml?new RegExp(r.ml):null)}
 try{L._re=p.length?new RegExp(p.join('|'),'g'):null}catch(e){L._re=null}L._hm=L._ml.some(Boolean)}
/* 1行をトークン化。st=行頭の状態(0または複数行ルール番号+1)、cb(種別,文字列)、戻り値=行末の状態 */
function tok(L,s,st,cb){let i=0;compile(L);

/* ===== 拡張用の登録API（将来、拡張JSONの内容をそのまま渡す。今回は読み込み処理なし）=====
 regCommand({id,title,alias,key,run:[既存コマンドid...],when:'editor'|'always'}) → C() で登録。keyが既存と衝突する場合は無視
 regTheme(id,{name,base:'dark'|'light',colors:{bg,fg,...}}) → THEMES に追加し「テーマ:」コマンドを生成
 regLanguage(id,{name,ext,comment,indent:'正規表現文字列',rules:[...]}) → defLang() で登録し拡張子と「言語を変更:」を生成
 （従来どおり C() / THEMES への直接追加 / defLang() も使える） */
function syncThemes(){for(const k in THEMES)if(!CM['th-'+k])C('th-'+k,'テーマ: '+THEMES[k].name,'theme '+k,'',()=>{S.theme=k;theme()})}
function syncLangs(){for(const L of Object.values(LANGS)){L.ext.forEach(e=>byExt[e]=L.id);if(!CM['lg-'+L.id])C('lg-'+L.id,'言語を変更: '+L.name,'language '+L.id,'',()=>{D.lang=L.id;D.vt=0;sched();status();dgs()})}}
function regCommand(x){if(!x||!x.id||(CM[x.id]&&!CM[x.id].x))return false;const r=[].concat(x.run||[]),k=x.key&&!KMAP[x.key]?x.key:'';C(x.id,x.title||x.id,x.alias||'',k,()=>r.forEach(i=>CM[i]&&CM[i].f()),{x:1,[x.when==='editor'?'ed':'g']:1});return true}
function regTheme(id,x){THEMES[id]={name:x.name||id,v:Object.assign({},THEMES[x.base==='light'?'light':'dark'].v,x.colors||{})};syncThemes();return true}
function regLanguage(id,x){if(typeof x.indent==='string')try{x.indent=new RegExp(x.indent)}catch(e){delete x.indent}defLang(id,x);syncLangs();return true}

/* ===== 追加コマンド・ショートカット ===== */
C('sidebar','表示: サイドバーの表示を切り替え','toggle sidebar','Mod+B',()=>setSide(!sv),{g:1});
C('explorer','表示: エクスプローラーにフォーカス','focus explorer','Mod+Shift+E',()=>{setSide(true,'x');(sd.querySelector('#tree .ti.on')||sd.querySelector('#tree .ti,#tree .bt')||sd.querySelector('#vx .ti')||$('sdx')).focus()},{g:1});
C('gsearch','検索: フォルダー内を検索','search in folder','Mod+Shift+F',()=>{setSide(true,'s');$('gq').focus();$('gq').select()},{g:1});
C('problems','表示: 問題パネルの表示を切り替え','toggle problems','Mod+Shift+M',()=>pnT(),{g:1});
C('settings','設定: 設定を開く（JSON）','open settings','Mod+,',openSettings,{g:1});
C('openfolder','ファイル: フォルダーを開く','open folder','',openFolder,{g:1});
C('bom','ファイル: BOMの有無を切り替え','toggle bom','',()=>{D.bom=!D.bom;status()},{g:1});
C('tbt','表示: ツールバーの表示を切り替え（PC）','toggle toolbar','',()=>document.body.classList.toggle('tbs'),{g:1});
/* ブラウザ予約キー（Ctrl+W / Ctrl+Tab / Ctrl+PageUp,Down）の代替と別名 */
const K=(k,id)=>{KMAP[k]=id};K('Mod+PageDown','next');K('Mod+PageUp','prev');K('Alt+PageDown','next');K('Alt+PageUp','prev');K('Alt+W','close');K('Alt+N','new');K('F1','palette');
$('s1').onclick=()=>CM.goto.f();$('s2').onclick=()=>{CM.sela.f();ta.focus({preventScroll:true})};$('s5').onclick=()=>CM.bom.f();$('s7').onclick=()=>pnT();

const ed=$('ed');
const TB=[['sidebar','☰'],['new','＋'],['open','📂'],['openfolder','🗂'],['save','💾'],0,['undo','↶'],['redo','↷'],0,['find','🔍'],['quick','📑'],['goto','↧'],['palette','≫'],['problems','⚠'],0,['cmt','//'],['ind','⇥'],['outd','⇤'],['fold','▾'],['unfold','▸'],['cuu','⊕↑'],['cud','⊕↓'],0,['ws','␣'],['thm','◐'],['fsm','A−'],['fsp','A＋']];
function tbR(){$('tb').innerHTML=TB.map(b=>b?'<button data-c="'+b[0]+'" title="'+esc(CM[b[0]].t.replace(/^.*: /,''))+(CM[b[0]].k?'（'+CM[b[0]].k.replace('Mod','Ctrl/Cmd')+'）':'')+'" aria-label="'+esc(CM[b[0]].t.replace(/^.*: /,''))+'"'+(b[0]==='ws'?' aria-pressed="'+S.ws+'"':'')+'>'+b[1]+'</button>':'<i></i>').join('')}
$('tb').addEventListener('click',e=>{const b=e.target.closest('button');if(b){CM[b.dataset.c].f();if(CM[b.dataset.c].ed)ta.focus({preventScroll:true})}});
$('s3').onclick=()=>openPal('cmd','言語を変更');$('s4').onclick=()=>{D.eol=D.eol==='LF'?'CRLF':'LF';status()};$('s6').onclick=()=>CM['in-'+{2:'4',4:'tab',tab:'2'}[S.indent]].f();
function combo(e){const c=e.code,k=/^Key[A-Z]$/.test(c)?c[3].toLowerCase():c==='BracketLeft'?'[':c==='BracketRight'?']':c==='Slash'?'/':e.key.length===1?e.key.toLowerCase():e.key;
 return((e.ctrlKey||e.metaKey)?'Mod+':'')+(e.altKey?'Alt+':'')+(e.shiftKey?'Shift+':'')+(k.length===1?k.toUpperCase():k)}
document.addEventListener('keydown',e=>{if(e.isComposing||composing)return;let c=combo(e);c=c.replace(/\+([a-z])$/,(m,x)=>'+'+x.toUpperCase());const id=KMAP[c];if(!id)return;const m=CM[id];
 if(m.ed&&document.activeElement!==ta)return;if(!m.g&&!m.ed)return;e.preventDefault();m.f()},true);
const P={mode:'cmd',items:[],on:0},pi=$('pi'),pr=$('pr');
function fz(q,s){q=q.toLowerCase();s=s.toLowerCase();let qi=0,sc=0,last=-2;for(let i=0;i<s.length&&qi<q.length;i++){if(s[i]===q[qi]){sc+=(i===last+1?5:1)+(i===0||' /:.-_'.includes(s[i-1])?3:0);last=i;qi++}}return qi===q.length?sc-s.length*.01:-1}
function pBuild(){const q=pi.value;let src;
 if(P.mode==='cmd')src=Object.values(CM).map(c=>({t:c.t,s:c.t+' '+c.a,k:c.k?c.k.replace('Mod','Ctrl/Cmd'):'',f:c.f}));
 else if(P.mode==='file')src=docs.map((d,i)=>({t:(dirty(d)?'● ':'')+d.name,s:d.name,k:d===D?'表示中':'',f:()=>activate(i)})).concat(wsq());
 else src=[{t:'行番号を入力（1〜'+D.lines.length+'）して Enter',s:'',k:'',f:null}];
 let r=src.map(x=>({x,sc:q&&P.mode!=='goto'?fz(q,x.s||x.t):0})).filter(o=>o.sc>=0);if(q&&P.mode!=='goto')r.sort((a,b)=>b.sc-a.sc);
 P.items=r.slice(0,100).map(o=>o.x);P.on=0;pRender()}
function pRender(){pr.innerHTML=P.items.map((x,i)=>'<div class="pi'+(i===P.on?' on':'')+'" role="option" data-i="'+i+'"><span>'+esc(x.t)+'</span><small>'+esc(x.k)+'</small></div>').join('');const o=pr.querySelector('.on');if(o)o.scrollIntoView({block:'nearest'})}
function openPal(mode,pre){P.mode=mode;$('pl').hidden=false;pi.value=pre||'';pi.setAttribute('aria-label',{cmd:'コマンドパレット入力',file:'クイックオープン入力',goto:'行番号の入力'}[mode]);pi.inputMode=mode==='goto'?'numeric':'text';pBuild();if(mode==='file'&&WS&&!WS.all)idx().then(pBuild);pi.focus()}
function closePal(){$('pl').hidden=true;ta.focus({preventScroll:true})}
function pRun(i){if(P.mode==='goto'){const n=parseInt(pi.value,10);if(!(n>=1&&n<=D.lines.length))return;closePal();setSels([{a:{l:n-1,c:0},h:{l:n-1,c:0},p:1}]);return}
 const x=P.items[i];if(!x||!x.f)return;closePal();x.f()}
pi.addEventListener('input',pBuild);
pi.addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229)return;
 if(e.key==='Escape'){e.preventDefault();closePal()}else if(e.key==='ArrowDown'){e.preventDefault();P.on=Math.min(P.items.length-1,P.on+1);pRender()}
 else if(e.key==='ArrowUp'){e.preventDefault();P.on=Math.max(0,P.on-1);pRender()}else if(e.key==='Enter'){e.preventDefault();pRun(P.on)}});
pr.addEventListener('click',e=>{const o=e.target.closest('.pi');if(o)pRun(+o.dataset.i)});
$('pl').addEventListener('mousedown',e=>{if(e.target.id==='pl')closePal()});

/* ===== 設定・初期化 ===== */
function theme(){const n=S.theme==='auto'?(mq.matches?'dark':'light'):S.theme;for(const k in THEMES[n].v)root.style.setProperty('--'+k,THEMES[n].v[k]);root.style.colorScheme=n}
function measure(){const c=document.createElement('canvas').getContext('2d');c.font=S.fs+'px '+getComputedStyle(ed).fontFamily;CW=c.measureText('M').width||S.fs*.6}
function setFs(d){S.fs=Math.max(8,Math.min(40,S.fs+d));CFG.fontSize=S.fs;lay()}
mq.addEventListener&&mq.addEventListener('change',theme);
const vv=window.visualViewport;
function vvr(){root.style.setProperty('--vh',(vv?vv.height:innerHeight)+'px');scrollTo(0,0);if(D){size();sched()}}
if(vv){vv.addEventListener('resize',()=>{vvr();if(document.activeElement===ta){rv=true}});vv.addEventListener('scroll',()=>scrollTo(0,0))}
addEventListener('resize',vvr);
theme();loadCfg();setSide(DESK.matches&&CFG.sidebarVisible,'x');
newDoc();vvr();ta.focus({preventScroll:true});
})();
</script>
